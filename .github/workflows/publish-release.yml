name: publish-release

on:
  push:
    branches: [main]
    paths:
      - "releases/v*.md"
  workflow_dispatch:
    inputs:
      version:
        description: "Release version without leading v (for example 0.9.0)"
        required: true
        type: string
      target_sha:
        description: "Optional exact commit. Legacy releases are bound to releases/release-manifest.yaml; future recovery releases may supply an explicit main ancestor."
        required: false
        type: string
      force_republish:
        description: "Update an existing GitHub Release body/title if the tag already exists. Never moves an existing tag."
        required: false
        default: false
        type: boolean

permissions:
  contents: write

concurrency:
  group: publish-release-${{ github.ref }}
  cancel-in-progress: false

jobs:
  discover:
    runs-on: ubuntu-latest
    outputs:
      versions: ${{ steps.discover.outputs.versions }}
    steps:
      - name: Check out trusted release engine
        uses: actions/checkout@v4
        with:
          ref: ${{ github.event_name == 'push' && github.sha || 'main' }}
          fetch-depth: 0

      - name: Discover release versions
        id: discover
        shell: bash
        env:
          EVENT_NAME: ${{ github.event_name }}
          BEFORE: ${{ github.event.before }}
          AFTER: ${{ github.sha }}
          INPUT_VERSION: ${{ inputs.version }}
        run: |
          set -euo pipefail
          if [[ "$EVENT_NAME" == "workflow_dispatch" ]]; then
            python scripts/release_governance.py normalize-version "$INPUT_VERSION" > /tmp/version
            version="$(cat /tmp/version)"
            printf 'versions=["%s"]\n' "$version" >> "$GITHUB_OUTPUT"
            exit 0
          fi
          python scripts/release_governance.py discover \
            --before "$BEFORE" \
            --after "$AFTER" \
            --github-output "$GITHUB_OUTPUT"

  publish:
    needs: discover
    if: ${{ needs.discover.outputs.versions != '[]' && needs.discover.outputs.versions != '' }}
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        version: ${{ fromJSON(needs.discover.outputs.versions) }}
    steps:
      - name: Check out trusted release engine
        uses: actions/checkout@v4
        with:
          ref: ${{ github.event_name == 'push' && github.sha || 'main' }}
          fetch-depth: 0
          path: engine

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install release-engine dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r engine/requirements.txt

      - name: Resolve exact release commit and validation mode
        id: target
        shell: bash
        env:
          EVENT_NAME: ${{ github.event_name }}
          VERSION: ${{ matrix.version }}
          INPUT_TARGET_SHA: ${{ inputs.target_sha }}
          EVENT_SHA: ${{ github.sha }}
        run: |
          set -euo pipefail
          cd engine

          if [[ "$EVENT_NAME" == "push" ]]; then
            target="$EVENT_SHA"
            mode="strict"
          else
            if legacy_target="$(python scripts/release_governance.py legacy-target --version "$VERSION" 2>/dev/null)"; then
              mode="legacy"
              target="$legacy_target"
              if [[ -n "${INPUT_TARGET_SHA:-}" ]]; then
                supplied="$(git rev-parse "$INPUT_TARGET_SHA^{commit}")"
                if [[ "$supplied" != "$target" ]]; then
                  echo "ERROR: legacy v$VERSION is immutably bound to $target, not $supplied." >&2
                  exit 1
                fi
              fi
            else
              mode="strict"
              if [[ -n "${INPUT_TARGET_SHA:-}" ]]; then
                target="$(git rev-parse "$INPUT_TARGET_SHA^{commit}")"
              else
                target="$(git log -1 --format=%H -- "releases/v${VERSION}.md")"
              fi
            fi
          fi

          test -n "$target"
          git merge-base --is-ancestor "$target" origin/main
          printf 'sha=%s\n' "$target" >> "$GITHUB_OUTPUT"
          printf 'mode=%s\n' "$mode" >> "$GITHUB_OUTPUT"

      - name: Check out exact release target
        uses: actions/checkout@v4
        with:
          ref: ${{ steps.target.outputs.sha }}
          fetch-depth: 0
          path: target

      - name: Validate release governance against target tree
        run: |
          python engine/scripts/release_governance.py \
            --repo-root target \
            validate \
            --mode "${{ steps.target.outputs.mode }}" \
            --version "${{ matrix.version }}" \
            --target-sha "${{ steps.target.outputs.sha }}"

      - name: Run target-native assurance quality gate
        shell: bash
        run: |
          set -euo pipefail
          if [[ -f target/scripts/run_quality_gate.py ]]; then
            python target/scripts/run_quality_gate.py --mode validate
          else
            echo "ERROR: target commit has no canonical quality gate." >&2
            exit 1
          fi

      - name: Prepare release metadata from target tree
        id: metadata
        run: |
          python engine/scripts/release_governance.py \
            --repo-root target \
            metadata \
            --version "${{ matrix.version }}" \
            --github-output "$GITHUB_OUTPUT"

      - name: Refuse to move an existing tag
        shell: bash
        env:
          TAG: v${{ matrix.version }}
          TARGET_SHA: ${{ steps.target.outputs.sha }}
        run: |
          set -euo pipefail
          cd engine
          git fetch --tags --force
          if git rev-parse -q --verify "refs/tags/$TAG" >/dev/null; then
            existing="$(git rev-list -n 1 "$TAG")"
            if [[ "$existing" != "$TARGET_SHA" ]]; then
              echo "ERROR: $TAG already points to $existing; refusing to move it to $TARGET_SHA." >&2
              exit 1
            fi
          fi

      - name: Create and push annotated tag
        shell: bash
        env:
          TAG: v${{ matrix.version }}
          TARGET_SHA: ${{ steps.target.outputs.sha }}
          TITLE: ${{ steps.metadata.outputs.title }}
        run: |
          set -euo pipefail
          cd engine
          if ! git rev-parse -q --verify "refs/tags/$TAG" >/dev/null; then
            git config user.name "github-actions[bot]"
            git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
            git tag -a "$TAG" "$TARGET_SHA" -m "$TITLE"
            git push origin "refs/tags/$TAG"
          else
            echo "$TAG already exists at the validated target; leaving tag immutable."
          fi

      - name: Publish GitHub Release
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
          TAG: v${{ matrix.version }}
          TITLE: ${{ steps.metadata.outputs.title }}
          NOTES_FILE: target/releases/v${{ matrix.version }}.md
          TARGET_SHA: ${{ steps.target.outputs.sha }}
          FORCE_REPUBLISH: ${{ inputs.force_republish }}
        run: |
          set -euo pipefail
          if gh release view "$TAG" --repo "$GITHUB_REPOSITORY" >/dev/null 2>&1; then
            if [[ "${FORCE_REPUBLISH:-false}" == "true" ]]; then
              gh release edit "$TAG" --repo "$GITHUB_REPOSITORY" --title "$TITLE" --notes-file "$NOTES_FILE"
            else
              echo "GitHub Release $TAG already exists; leaving it unchanged."
            fi
          else
            gh release create "$TAG" --repo "$GITHUB_REPOSITORY" \
              --verify-tag \
              --target "$TARGET_SHA" \
              --title "$TITLE" \
              --notes-file "$NOTES_FILE"
          fi

      - name: Publish release evidence summary
        shell: bash
        run: |
          {
            echo "## Release publication evidence"
            echo
            echo "- Version: \`v${{ matrix.version }}\`"
            echo "- Tag target: \`${{ steps.target.outputs.sha }}\`"
            echo "- Validation mode: \`${{ steps.target.outputs.mode }}\`"
            echo "- Notes source: \`releases/v${{ matrix.version }}.md\` at target commit"
            echo "- Target-native assurance validation: passed"
            echo "- Tag mutation policy: immutable"
          } >> "$GITHUB_STEP_SUMMARY"
