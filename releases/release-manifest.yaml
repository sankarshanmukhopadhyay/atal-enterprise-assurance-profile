schema_version: "1.0"
policy:
  legacy_backfill:
    description: "Historical release checkpoints created before governed release automation was installed. These targets are immutable and are validated using the repository-native quality gate available at each checkpoint where present."
    authority: "Explicit maintainer-reviewed mapping of release version to the last implementation commit for that release sequence."
  strict_future:
    description: "Releases created after governed release automation must satisfy the complete release/version contract at the exact tag target."
    applies_from: "0.10.0"
