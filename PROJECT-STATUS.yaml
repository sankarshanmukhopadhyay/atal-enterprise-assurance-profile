schema_version: "1.0"
project:
  name: atal-enterprise-assurance-profile
  version: "0.9.3"
  maturity: assurance-candidate
  lifecycle: active
  operational_status: active-development
  specification_status: pre-1.0-candidate
  intended_use:
    - enterprise-assurance-profile-development
    - control-and-evidence-mapping
    - implementation-readiness-analysis
    - reproducible-assurance-evidence
    - deployment-scoped-assurance-claims
    - executable-conformance-testing
    - adversarial-assurance-testing
    - independent-assessor-handoff
    - cross-framework-evidence-routing
  not_asserted:
    - production-certification
    - regulator-approval
    - independent-third-party-assurance
    - legal-compliance-equivalence
authority:
  normative_scope:
    - atal-enterprise-assurance-profile
  does_not_own:
    - upstream-atal-semantics
    - enterprise-risk-acceptance
    - regulator-authority
    - external-framework-governance
  delegation: "Repository maintainers govern the profile, mappings, tests, evidence contracts, handoff contracts, and EAP claim semantics; system owners, assessors, risk authorities, regulators, ATAL stewards, and external frameworks retain their own authority."
  revocation_or_supersession: "Profile controls, mappings, baselines, tests, handoffs, and claims are superseded through explicit versioned changes with prior states retained for audit. Assurance claims additionally support expiry and explicit revocation."
evidence:
  validation_commands:
    - python scripts/check_upstream_integrity.py
    - python scripts/validate_test_catalog.py
    - python scripts/validate_external_mappings.py
    - python scripts/check_assurance_invariants.py
    - python scripts/validate_l2_worked_example.py
    - python scripts/validate_l3_worked_example.py
    - python scripts/verify_assessor_handoff.py --tamper-self-test
    - python scripts/run_quality_gate.py --mode validate
    - python scripts/run_quality_gate.py --mode all
  evidence_outputs:
    - upstream/atal-baseline.yaml
    - assurance/invariants.yaml
    - assurance/handoff-source-set.yaml
    - schemas/assessor-handoff.schema.json
    - tests/fixtures/handoff/tampered-digest.json
    - examples/eap-l2-worked-example/
    - examples/eap-l3-worked-example/
    - artifacts/eap-l2-assurance-claim.json
    - artifacts/eap-l3-assurance-claim.json
    - artifacts/eap-l3-assessor-handoff.json
    - artifacts/eap-l3-handoff-verification.json
    - artifacts/eap-l3-handoff-tamper-verification.json
    - artifacts/eap-l2-assessment-report.md
    - artifacts/eap-l3-assessment-report.md
    - artifacts/traceability-matrix.md
  known_limitations:
    - v0.9.3 is an assurance candidate, not an external certification scheme
    - worked deployments and assessor handoffs are synthetic reference evidence, not claims about live enterprise deployments
    - independent verification proves bounded integrity/reproducibility, not truth of underlying evidence
    - organization-specific risk acceptance remains outside repository authority
    - external-framework mappings do not establish legal or normative equivalence
    - network verification that the pinned upstream commit remains canonical is not part of the offline quality gate
